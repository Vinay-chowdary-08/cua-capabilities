[project]
name = "cua-capabilities"
version = "0.1.0"
description = "Discover, canonicalize, and replay computer-use capabilities against hostile legacy UIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "playwright>=1.48.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
  "rich>=13.9.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua", "target_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
